# Shared standards; upstream action SHAs verified 2026-10-18.
name: Update dependencies
'on':
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  dependencies:
    permissions:
      contents: write
      pull-requests: write
    uses: eigger/hass-repo-standards/.github/workflows/dependency-update.yml@c696e15c164daa6c7deca4140b899bd0e80e8846
    with:
      domain: jaalee
      packages: '[]'
      python-version: '3.14'
      ha-components: 'bluetooth sensor binary_sensor event'
      test-profile: ha
      validation-command: python -m ruff check . && python -m ruff format --check . && python -m pytest tests/components/jaalee/ -v
